[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-audit-log",
    "crates/lenso-audit-log-postgres-plugin",
]

[workspace.package]
edition = "2024"
homepage = "https://github.com/LioRael/lenso-audit-log-plugin"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-audit-log-plugin"
rust-version = "1.94"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lenso = { version = "0.5.0" }
lenso-app-plan = { version = "0.3.0" }
lenso-contract-codegen = { version = "=0.6.4" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-native-adapter = { version = "0.3.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-postgres-kit = { version = "0.1.0" }
lenso-runner = { version = "0.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5"
uuid = { version = "1.19", features = ["v7"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
