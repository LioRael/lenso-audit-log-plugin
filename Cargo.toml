[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-audit-log",
    "crates/lenso-audit-log-core",
    "crates/lenso-audit-log-d1-plugin",
    "crates/lenso-audit-log-agent-tools-plugin",
    "crates/lenso-audit-log-postgres-plugin",
]

[workspace.package]
edition = "2024"
homepage = "https://github.com/LioRael/lenso-audit-log-plugin"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-audit-log-plugin"
rust-version = "1.94"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lenso = "=0.5.29"
lenso-capability-agent-tool-provider = "=0.3.0"
lenso-app-plan = "=0.4.6"
lenso-contract-runtime = "=0.2.0"
lenso-kernel = "=0.3.12"
lenso-native-adapter = "=0.3.20"
lenso-plugin-authoring = "=0.2.0"
lenso-postgres-kit = "=0.1.1"
lenso-runner = "=0.2.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5"
uuid = { version = "1.19", features = ["v7"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
