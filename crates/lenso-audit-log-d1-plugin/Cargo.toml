[package]
name = "lenso-audit-log-d1-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.audit-log.d1"
root-slot = "audit"
[package.metadata.lenso.host-facilities.store]
native = "host_facilities::store"
workers = "host_facilities::store"
workers-adapter = "src/host_facilities/store.mjs"

[dependencies]
lenso.workspace = true
lenso-audit-log-core = { path = "../lenso-audit-log-core", version = "0.1.0" }
lenso-capability-audit-log = { path = "../lenso-capability-audit-log", version = "0.1.1" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
serde-wasm-bindgen = "0.6"

[lints]
workspace = true
