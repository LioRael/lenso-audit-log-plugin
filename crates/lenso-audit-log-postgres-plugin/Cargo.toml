[package]
name = "lenso-audit-log-postgres-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PostgreSQL-backed durable Audit Log Plugin for Lenso applications."
readme = "../../README.md"
categories = ["development-tools", "web-programming"]
keywords = ["lenso", "plugin", "audit", "postgres"]

[features]
default = []
postgres-acceptance = []

[package.metadata.lenso]
plugin-id = "lenso.audit-log.postgres"
root-slot = "audit"

[dependencies]
chrono.workspace = true
lenso.workspace = true
lenso-capability-audit-log = { path = "../lenso-capability-audit-log", version = "0.1.0" }
lenso-capability-secrets = { version = "0.1.2" }
lenso-contract-runtime.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-runner.workspace = true
tokio.workspace = true
url.workspace = true

[lints]
workspace = true
